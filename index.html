<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practicum 8 - Responsive Image Gallery</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, sans-serif;
    background-color: #f2f2f2;
    font-size: 18px;
  }

  header {
    background-color: #2c3e50;
    color: white;
    text-align: center;
    padding: 20px;
  }

  header h1 {
    font-size: 32px;
  }

  .note {
    margin-top: 8px;
    font-size: 16px;
  }

  /* gallery - 3 columns for desktop */
  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
    max-width: 1100px;
    margin: auto;
  }

  .gallery img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    border: 3px solid white;
    border-radius: 5px;
  }

  .gallery img:hover {
    border-color: #2c3e50;
  }

  footer {
    background-color: #2c3e50;
    color: white;
    text-align: center;
    padding: 12px;
    font-size: 14px;
  }

  /* tablet - 2 columns */
  @media (max-width: 900px) {
    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }

    .gallery img {
      height: 200px;
    }

    header h1 {
      font-size: 26px;
    }
  }

  /* mobile - 1 column */
  @media (max-width: 600px) {
    .gallery {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px;
    }

    .gallery img {
      height: 180px;
    }

    body {
      font-size: 15px;
    }

    header h1 {
      font-size: 20px;
    }

    /* hide this text on small screens */
    .note {
      display: none;
    }
  }

  /* for phones in landscape mode */
  @media (max-width: 900px) and (orientation: landscape) {
    .gallery {
      grid-template-columns: repeat(2, 1fr);
    }
  }
</style>
</head>

<body>

<header>
  <h1>My Image Gallery</h1>
  <p class="note">Resize the browser window to see the layout change</p>
</header>

<div class="gallery">
  <img src="https://picsum.photos/id/1015/600/400" alt="River valley">
  <img src="https://picsum.photos/id/1018/600/400" alt="Mountains">
  <img src="https://picsum.photos/id/1025/600/400" alt="Dog">
  <img src="https://picsum.photos/id/1035/600/400" alt="Waterfall">
  <img src="https://picsum.photos/id/1043/600/400" alt="Forest">
  <img src="https://picsum.photos/id/1050/600/400" alt="Lake">
</div>

<footer>
  <p>Practicum 8 - Media Queries</p>
</footer>

</body>
</html>
